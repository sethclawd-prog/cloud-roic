name: Refresh from EDGAR
on:
  schedule:
    - cron: "17 11 * * *"   # every day, 11:17 UTC (after EDGAR's overnight index update)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Pull filings and rebuild the page
        env:
          EDGAR_UA: "cloud-roic (https://github.com/${{ github.repository }}) sethclawd@gmail.com"
        run: python3 roic.py
      - name: Commit the refreshed page
        run: |
          git config user.name "cloud-roic bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || git commit -m "Refresh from EDGAR $(date -u +%Y-%m-%d)"
          git push
